[workspace]
resolver = "2"
members = [
    "crates/ana-core",
    "crates/ana-media",
    "crates/ana-pipeline",
    "crates/ana-cli",
    "crates/ana-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-or-later"

[workspace.dependencies]
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Frame dimensions come from files and presets, and dimensions are what buffer
# arithmetic is made of. Both are bounded at the door, so this should never
# fire — it is here so that if one ever slips through, the release build stops
# rather than wrapping and carrying on with a nonsense size.
overflow-checks = true
